<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/cardapio/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Peça online com o PedeOn by Lyncar.">
  <meta name="theme-color" content="#075E6F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PedeOn">
  <link rel="apple-touch-icon" href="/cardapio/icons/Icon-192.png?v=20260919">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="/cardapio/icons/Icon-192.png?v=20260919">
  <link rel="icon" type="image/png" sizes="512x512" href="/cardapio/icons/Icon-512.png?v=20260919">
  <link rel="shortcut icon" type="image/png" href="/cardapio/favicon.png?v=20260919">

  <title>PedeOn by Lyncar</title>
  <link rel="manifest" href="/cardapio/manifest.json?v=20260919">
</head>
<body>
  <script>
    // O PedeOn é atualizado pelo servidor. Remove caches PWA legados para que
    // Safari/Chrome não mantenham uma versão antiga do cardápio.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        for (const registration of registrations) registration.unregister();
      });
    }
    if ('caches' in window) {
      caches.keys().then((keys) => {
        for (const key of keys) {
          if (key.startsWith('flutter-app-cache')) caches.delete(key);
        }
      });
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
